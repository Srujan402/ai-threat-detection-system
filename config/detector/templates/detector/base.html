
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Threat Detection SOC{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body { background: #0b1220; color: #e5e7eb; }
        .navbar, .panel { background: #111c2e; }
        .panel { border: 1px solid #26364d; border-radius: 12px; }
        .muted { color: #9caec5; }
        .table { --bs-table-bg: transparent; --bs-table-color: #e5e7eb;
                 --bs-table-border-color: #26364d; }
        .form-control, .form-select {
            background: #0b1220; color: #e5e7eb; border-color: #34445c;
        }
        .form-control:focus, .form-select:focus {
            background: #0b1220; color: #fff; border-color: #60a5fa;
        }
        .form-select option { background: #0b1220; color: #fff; }
        a { text-decoration: none; }
        
/* Dashboard metric cards */
.metric-card {
    position: relative;
    overflow: hidden;
    transition: transform 0.18s ease, border-color 0.18s ease;
}

.metric-card:hover {
    transform: translateY(-3px);
    border-color: #526782;
}

.metric-number {
    font-size: clamp(1.8rem, 3vw, 2.5rem);
    font-weight: 750;
    letter-spacing: -1px;
    line-height: 1.2;
    overflow-wrap: anywhere;
}

.metric-icon {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    font-size: 1.5rem;
    background: #1c2d45;
}

.metric-blue { border-top: 3px solid #60a5fa; }
.metric-purple { border-top: 3px solid #a78bfa; }
.metric-orange { border-top: 3px solid #fb923c; }
.metric-red { border-top: 3px solid #f87171; }

.status-indicator {
    color: #93c5fd;
    background: #172b46;
    border: 1px solid #29486b;
    border-radius: 20px;
    padding: 5px 10px;
    font-size: 0.75rem;
}

.severity-track {
    height: 8px;
    width: 100%;
    overflow: hidden;
    border-radius: 20px;
    background: #26364d;
}

.severity-fill {
    height: 100%;
    border-radius: inherit;
    transition: width 0.3s ease;
}

.workspace-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px;
    border: 1px solid #26364d;
    border-radius: 10px;
    color: #e5e7eb;
    transition: background 0.18s ease, border-color 0.18s ease;
}

.workspace-link:hover {
    background: #17263b;
    border-color: #526782;
    color: #fff;
}

.workspace-link small {
    margin-top: 4px;
}

.alert-title {
    color: #93c5fd;
    font-weight: 600;
}

.alert-title:hover {
    color: #bfdbfe;
    text-decoration: underline;
}

.severity-badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 700;
}

.severity-critical {
    background: #451a1a;
    color: #fca5a5;
}

.severity-high {
    background: #431f12;
    color: #fdba74;
}

.severity-medium {
    background: #422006;
    color: #fde047;
}

.severity-low {
    background: #143525;
    color: #86efac;
}

.status-text {
    color: #cbd5e1;
    font-size: 0.875rem;
}

.table thead th {
    color: #9caec5;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
}

.table tbody tr:last-child td {
    border-bottom: 0;
}

@media (max-width: 576px) {
    .panel {
        border-radius: 10px;
    }

    .panel.p-4 {
        padding: 1rem !important;
    }
}

    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">
            Sentinel SOC
        </a>
        <div class="navbar-nav flex-row gap-3">
            <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
            <a class="nav-link" href="{% url 'alerts' %}">Alerts</a>
            <a class="nav-link" href="/admin/">Admin</a>
        </div>
    </div>
</nav>

<main class="container pb-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close"
                        data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
